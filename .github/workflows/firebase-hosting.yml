# Deploys the site to Firebase Hosting (project bright-34c23) whenever main changes.
# Requires a repository secret FIREBASE_SERVICE_ACCOUNT containing the JSON key of a
# service account with the "Firebase Hosting Admin" role.
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: bright-34c23
          channelId: live
